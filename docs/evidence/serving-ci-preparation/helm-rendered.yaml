---
# Source: iot-api/templates/service.yaml
# ClusterIP only; access remains private through the existing IAP connection.
apiVersion: v1
kind: Service
metadata:
  name: iot-feature-api
  labels: {app.kubernetes.io/name: iot-api, app.kubernetes.io/instance: iot-feature-api}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: iot-feature-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
# Source: iot-api/templates/deployment.yaml
# All live pods retain a usable replica during an upgrade; --atomic is enforced by the deployment CLI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-feature-api
  labels: {app.kubernetes.io/name: iot-api, app.kubernetes.io/instance: iot-feature-api}
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/instance: iot-feature-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: iot-api, app.kubernetes.io/instance: iot-feature-api}
      annotations:
        iot.coursework/revision-marker: "serve-jenkins-1"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - command:
          - python
          - -c
          - import shutil,pathlib; p=pathlib.Path('/state/registry'); p.mkdir(); [shutil.copyfile('/seed/'+n,'/state/'+n)
            for n in ['context.json','verification.json','_READY.json']]; shutil.copyfile('/seed/registry.db','/state/registry/registry.db')
          image: iot-coursework-feature-api:serve-jenkins-1
          imagePullPolicy: Never
          name: copy-state
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
          - mountPath: /seed
            name: seed
            readOnly: true
          - mountPath: /state
            name: state
      containers:
        - name: api
          image: "iot-coursework-feature-api:serve-jenkins-1"
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          lifecycle:
            preStop:
              # Keep the old process alive while EndpointSlice/kube-proxy withdraw its address.
              exec: {command: [python, -c, 'import time; time.sleep(5)']}
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: IOT_FEAST_REDIS
              value: online-serve-jenkins-1.iot-features.svc.cluster.local:6379
            - name: IOT_SERVING_STATE
              value: /state
            - name: IOT_KSERVE_URL
              value: http://iot-pump-serve-jenkins-1-predictor.iot-serving.svc.cluster.local
            - name: IOT_MODEL_PIN
              value: /app/model-pin.json
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            failureThreshold: 45
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /state
              name: state
            - mountPath: /tmp
              name: tmp
      volumes:
        - configMap:
            name: iot-feature-state-serve-jenkins-1
          name: seed
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: state
        - emptyDir:
            medium: Memory
            sizeLimit: 32Mi
          name: tmp
---
# Source: iot-api/templates/hpa.yaml
# CPU utilization uses the declared request, with a small same-node demonstration ceiling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iot-feature-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: iot-feature-api}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
