# Join the existing dedicated GPU VM as a tainted worker; keep the control/data VM unchanged.
- name: Join the private inference worker
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    iot_gpu_root: /srv/iot-inference
    iot_gpu_node_name: iot-cw-gpu
    iot_k3s_release: v1.35.9+k3s1
    iot_k3s_binary_sha256: 897acb21cca57d477a211102251a6591450ce767344a9faaa121a1007ca9fa9a
    iot_k3s_installer_sha256: 8598e002e61d658fed7b7542fc6d2c66d8da6eae69e088830105d2ee1ffb6d91
  pre_tasks:
    - name: Require an explicit existing project and private control address
      ansible.builtin.assert:
        that:
          - expected_project_id is defined
          - iot_control_ip is defined
          - iot_control_ip is match('^10\.42\.0\.[1-9][0-9]*$')
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
    - name: Read native project identity
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/project/project-id
        headers: {Metadata-Flavor: Google}
        return_content: true
        use_proxy: false
      register: iot_gpu_project
      no_log: true
    - name: Read native instance identity
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/name
        headers: {Metadata-Flavor: Google}
        return_content: true
        use_proxy: false
      register: iot_gpu_instance
      no_log: true
    - name: Refuse any other host or project
      ansible.builtin.assert:
        that:
          - iot_gpu_project.content == expected_project_id
          - iot_gpu_instance.content == iot_gpu_node_name
    - name: Inspect the private bootstrap token without returning its content
      ansible.builtin.stat:
        path: '{{ iot_gpu_root }}/private/agent-token'
      register: iot_gpu_token
      no_log: true
    - name: Require the root-only separately transported join credential
      ansible.builtin.assert:
        that:
          - iot_gpu_token.stat.exists
          - iot_gpu_token.stat.uid == 0
          - iot_gpu_token.stat.mode == '0600'
      no_log: true
    - name: Require the already functioning NVIDIA runtime
      ansible.builtin.command:
        argv: [nvidia-ctk, --version]
      changed_when: false
  roles:
    - gpu_node
