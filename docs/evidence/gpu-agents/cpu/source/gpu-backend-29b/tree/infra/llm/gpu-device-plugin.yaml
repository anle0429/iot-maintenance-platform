# Adapted from NVIDIA's Apache-2.0 v0.20.1 static manifest; restrict discovery to the owned GPU worker.
# https://github.com/NVIDIA/k8s-device-plugin/blob/v0.20.1/deployments/static/nvidia-device-plugin.yml
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: iot-gpu-nvidia
  labels: {app.kubernetes.io/part-of: iot-gpu-inference}
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iot-nvidia-device-plugin
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: iot-gpu-inference}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: iot-nvidia-device-plugin}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iot-nvidia-device-plugin
        app.kubernetes.io/part-of: iot-gpu-inference
    spec:
      automountServiceAccountToken: false
      runtimeClassName: iot-gpu-nvidia
      nodeSelector:
        kubernetes.io/hostname: iot-cw-gpu
        iot.coursework/role: inference-gpu
      tolerations:
        - key: iot.coursework/inference-gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin@sha256:d279ecdb47b252c4cd96f4224650e9808c36012f6979570c9611ddbc5b0749a7
          env:
            - {name: FAIL_ON_INIT_ERROR, value: 'true'}
            - {name: DEVICE_LIST_STRATEGY, value: envvar}
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: 'compute,utility'}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: device-plugins, mountPath: /var/lib/kubelet/device-plugins}
      volumes:
        - name: device-plugins
          hostPath: {path: /var/lib/kubelet/device-plugins, type: Directory}
