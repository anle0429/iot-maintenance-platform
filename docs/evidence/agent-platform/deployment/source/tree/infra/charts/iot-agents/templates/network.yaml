# Actor HTTP calls are proxied by Substrate's trusted router and still require the role-specific MCP bearer token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: iot-agent-actor-mcp}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: iot-mcp}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-router}
      ports: [{protocol: TCP, port: 8080}]
---
# Kubernetes policies match the router Pod's port after Service translation (80 -> 8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: iot-agent-control-router}
spec:
  podSelector:
    matchLabels: {iot.coursework/agent-control: 'true'}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-router}
      ports: [{protocol: TCP, port: 8080}]
