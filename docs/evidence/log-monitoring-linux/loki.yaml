{
  "auth_enabled": false,
  "server": {
    "http_listen_address": "127.0.0.1",
    "http_listen_port": 13100,
    "grpc_listen_address": "127.0.0.1",
    "grpc_listen_port": 19096,
    "log_level": "info"
  },
  "common": {
    "instance_addr": "127.0.0.1",
    "path_prefix": "/srv/iot-data/workspace/iot-maintenance-platform/data/runtime/logging-28-ci4/loki",
    "storage": {
      "filesystem": {
        "chunks_directory": "/srv/iot-data/workspace/iot-maintenance-platform/data/runtime/logging-28-ci4/loki/chunks",
        "rules_directory": "/srv/iot-data/workspace/iot-maintenance-platform/data/runtime/logging-28-ci4/loki/rules"
      }
    },
    "replication_factor": 1,
    "ring": {
      "kvstore": {
        "store": "inmemory"
      }
    }
  },
  "schema_config": {
    "configs": [
      {
        "from": "2020-10-24",
        "store": "tsdb",
        "object_store": "filesystem",
        "schema": "v13",
        "index": {
          "prefix": "index_",
          "period": "24h"
        }
      }
    ]
  },
  "query_range": {
    "results_cache": {
      "cache": {
        "embedded_cache": {
          "enabled": true,
          "max_size_mb": 32
        }
      }
    }
  },
  "chunk_store_config": {
    "chunk_cache_config": {
      "embedded_cache": {
        "enabled": true,
        "max_size_mb": 32
      }
    }
  },
  "limits_config": {
    "retention_period": "24h",
    "ingestion_rate_mb": 1,
    "ingestion_burst_size_mb": 2,
    "max_query_parallelism": 2,
    "query_timeout": "30s"
  },
  "compactor": {
    "working_directory": "/srv/iot-data/workspace/iot-maintenance-platform/data/runtime/logging-28-ci4/loki/compactor",
    "retention_enabled": true,
    "delete_request_store": "filesystem"
  },
  "analytics": {
    "reporting_enabled": false
  }
}
