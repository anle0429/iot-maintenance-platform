# PIPELINE DEFINITION
# Name: iot-failure-training-v1
# Description: Frozen60-day protocol, native Feast load and isolated train/holdout components.
# Inputs:
#    workspace: str [Default: '/ml-data/training']
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        selection:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        evaluation:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-load-feast:
    executorLabel: exec-load-feast
    inputDefinitions:
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        cohort:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-split-time:
    executorLabel: exec-split-time
    inputDefinitions:
      artifacts:
        cohort:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        partitions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        partitions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        selection:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --step
        - evaluate
        - --input
        - '{{$.inputs.artifacts[''selection''].path}}'
        - --output
        - '{{$.outputs.artifacts[''evaluation''].path}}'
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.driver.maxResultSize=128m
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/training_job.py
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          memoryLimit: 10.73741824
          resourceCpuLimit: '2'
          resourceMemoryLimit: 10Gi
    exec-load-feast:
      container:
        args:
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --state
        - /workspace/data/feast/batch-medium-27
        - --batch-report
        - /workspace/outputs/feast-batch-27/batch/report.json
        - --artifacts
        - /workspace/data/feature-datasets/feature-medium-27-v2/artifacts
        - --feature-report
        - /workspace/outputs/feature-medium-27-v2/feature-report.json
        - --output
        - '{{$.outputs.artifacts[''cohort''].path}}'
        - --executor-input
        - '{{$}}'
        command:
        - python
        - -m
        - ml.training_load
        image: iot-coursework-feast:0.67.0
        resources:
          cpuLimit: 2.0
          memoryLimit: 10.73741824
          resourceCpuLimit: '2'
          resourceMemoryLimit: 10Gi
    exec-split-time:
      container:
        args:
        - --step
        - split
        - --input
        - '{{$.inputs.artifacts[''cohort''].path}}'
        - --output
        - '{{$.outputs.artifacts[''partitions''].path}}'
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.driver.maxResultSize=128m
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/training_job.py
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          memoryLimit: 10.73741824
          resourceCpuLimit: '2'
          resourceMemoryLimit: 10Gi
    exec-train-model:
      container:
        args:
        - --step
        - train
        - --input
        - '{{$.inputs.artifacts[''partitions''].path}}'
        - --output
        - '{{$.outputs.artifacts[''selection''].path}}'
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.driver.maxResultSize=128m
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/training_job.py
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          memoryLimit: 10.73741824
          resourceCpuLimit: '2'
          resourceMemoryLimit: 10Gi
pipelineInfo:
  description: Frozen60-day protocol, native Feast load and isolated train/holdout
    components.
  name: iot-failure-training-v1
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - train-model
        inputs:
          artifacts:
            selection:
              taskOutputArtifact:
                outputArtifactKey: selection
                producerTask: train-model
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: evaluate-model
      load-feast:
        cachingOptions: {}
        componentRef:
          name: comp-load-feast
        inputs:
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: load-feast
      split-time:
        cachingOptions: {}
        componentRef:
          name: comp-split-time
        dependentTasks:
        - load-feast
        inputs:
          artifacts:
            cohort:
              taskOutputArtifact:
                outputArtifactKey: cohort
                producerTask: load-feast
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: split-time
      train-model:
        cachingOptions: {}
        componentRef:
          name: comp-train-model
        dependentTasks:
        - split-time
        inputs:
          artifacts:
            partitions:
              taskOutputArtifact:
                outputArtifactKey: partitions
                producerTask: split-time
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      workspace:
        defaultValue: /ml-data/training
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.3
