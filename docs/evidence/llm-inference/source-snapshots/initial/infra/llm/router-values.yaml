# CPU-only lab: endpoint selection uses router-observed in-flight load, not invented vLLM metrics.
router:
  epp:
    image:
      tag: v1.0.0
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: '1', memory: 1Gi}
    pluginsConfigFile: iot-load.yaml
    pluginsCustomConfig:
      iot-load.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: inflight-load-producer
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: token-load-scorer
  inferencePool:
    failureMode: FailClose
  modelServers:
    protocol: http
    targetPorts: [{number: 8080}]
    matchLabels: {app.kubernetes.io/name: iot-llm-model}
  proxy:
    failOpen: false
    args:
    - --service-node
    - iot-llm
    - --log-level
    - warn
    - --concurrency
    - '1'
    - -c
    - /etc/envoy/envoy.yaml
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: '1', memory: 512Mi}
  tracing:
    enabled: false
