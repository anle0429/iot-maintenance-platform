# PIPELINE DEFINITION
# Name: iot-notebook-distributed-training-v1
# Description: Notebook parity, two-column labels, actual distributed Spark fit and fixed-protocol evaluation.
# Inputs:
#    workspace: str [Default: '/ml-data/notebook-distributed']
components:
  comp-cluster-evaluate:
    executorLabel: exec-cluster-evaluate
    inputDefinitions:
      artifacts:
        selection:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        evaluation:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-cluster-split:
    executorLabel: exec-cluster-split
    inputDefinitions:
      artifacts:
        cohort:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        partitions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-distributed-train:
    executorLabel: exec-distributed-train
    inputDefinitions:
      artifacts:
        partitions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        selection:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-notebook-load:
    executorLabel: exec-notebook-load
    inputDefinitions:
      parameters:
        workspace:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        cohort:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-validate-saved-model:
    executorLabel: exec-validate-saved-model
    inputDefinitions:
      artifacts:
        selection:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        verification:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-cluster-evaluate:
      container:
        args:
        - --step
        - evaluate
        - --input
        - '{{$.inputs.artifacts[''selection''].path}}'
        - --output
        - '{{$.outputs.artifacts[''evaluation''].path}}'
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.driver.maxResultSize=128m
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/cluster_training_job.py
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONPATH
          value: /workspace
        - name: FEAST_USAGE
          value: 'False'
        - name: IOT_FEAST_REDIS
          value: online:6379
        - name: IOT_FEAST_TEMP
          value: /ml-scratch/offline
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SPARK_LOCAL_IP
          value: 127.0.0.1
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 10.73741824
          memoryRequest: 2.147483648
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 10Gi
          resourceMemoryRequest: 2Gi
    exec-cluster-split:
      container:
        args:
        - --step
        - split
        - --input
        - '{{$.inputs.artifacts[''cohort''].path}}'
        - --output
        - '{{$.outputs.artifacts[''partitions''].path}}'
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.driver.maxResultSize=128m
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/cluster_training_job.py
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONPATH
          value: /workspace
        - name: FEAST_USAGE
          value: 'False'
        - name: IOT_FEAST_REDIS
          value: online:6379
        - name: IOT_FEAST_TEMP
          value: /ml-scratch/offline
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SPARK_LOCAL_IP
          value: 127.0.0.1
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 10.73741824
          memoryRequest: 2.147483648
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 10Gi
          resourceMemoryRequest: 2Gi
    exec-distributed-train:
      container:
        args:
        - --step
        - train
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --input
        - '{{$.inputs.artifacts[''partitions''].path}}'
        - --output
        - '{{$.outputs.artifacts[''selection''].path}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - python3
        - /workspace/ml/distributed_submit.py
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONPATH
          value: /workspace
        - name: FEAST_USAGE
          value: 'False'
        - name: IOT_FEAST_REDIS
          value: online:6379
        - name: IOT_FEAST_TEMP
          value: /ml-scratch/offline
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SPARK_LOCAL_IP
          value: 127.0.0.1
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 10.73741824
          memoryRequest: 2.147483648
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 10Gi
          resourceMemoryRequest: 2Gi
    exec-notebook-load:
      container:
        args:
        - --workspace
        - '{{$.inputs.parameters[''workspace'']}}'
        - --output
        - '{{$.outputs.artifacts[''cohort''].path}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --state
        - /workspace/data/feast/batch-medium-27
        - --batch-report
        - /workspace/outputs/feast-batch-27/batch/report.json
        - --artifacts
        - /workspace/data/feature-datasets/feature-medium-27-v2/artifacts
        - --feature-report
        - /workspace/outputs/feature-medium-27-v2/feature-report.json
        - --executor-input
        - '{{$}}'
        command:
        - python
        - -m
        - ml.notebook_load_component
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONPATH
          value: /workspace
        - name: FEAST_USAGE
          value: 'False'
        - name: IOT_FEAST_REDIS
          value: online:6379
        - name: IOT_FEAST_TEMP
          value: /ml-scratch/offline
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SPARK_LOCAL_IP
          value: 127.0.0.1
        image: iot-coursework-feast:0.67.0
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 10.73741824
          memoryRequest: 2.147483648
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 10Gi
          resourceMemoryRequest: 2Gi
    exec-validate-saved-model:
      container:
        args:
        - --selection
        - '{{$.inputs.artifacts[''selection''].path}}'
        - --output
        - '{{$.outputs.artifacts[''verification''].path}}'
        - --protocol
        - /workspace/ml/protocols/medium-60d-v1.json
        - --executor-input
        - '{{$}}'
        command:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --driver-memory
        - 6g
        - --conf
        - spark.local.dir=/ml-scratch
        - /workspace/ml/notebook_validate_component.py
        env:
        - name: HOME
          value: /tmp
        - name: PYTHONPATH
          value: /workspace
        - name: FEAST_USAGE
          value: 'False'
        - name: IOT_FEAST_REDIS
          value: online:6379
        - name: IOT_FEAST_TEMP
          value: /ml-scratch/offline
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SPARK_LOCAL_IP
          value: 127.0.0.1
        image: iot-coursework-spark:3.5.9
        resources:
          cpuLimit: 2.0
          cpuRequest: 0.5
          memoryLimit: 10.73741824
          memoryRequest: 2.147483648
          resourceCpuLimit: '2'
          resourceCpuRequest: 500m
          resourceMemoryLimit: 10Gi
          resourceMemoryRequest: 2Gi
pipelineInfo:
  description: Notebook parity, two-column labels, actual distributed Spark fit and
    fixed-protocol evaluation.
  name: iot-notebook-distributed-training-v1
root:
  dag:
    tasks:
      cluster-evaluate:
        cachingOptions: {}
        componentRef:
          name: comp-cluster-evaluate
        dependentTasks:
        - distributed-train
        - validate-saved-model
        inputs:
          artifacts:
            selection:
              taskOutputArtifact:
                outputArtifactKey: selection
                producerTask: distributed-train
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: cluster-evaluate
      cluster-split:
        cachingOptions: {}
        componentRef:
          name: comp-cluster-split
        dependentTasks:
        - notebook-load
        inputs:
          artifacts:
            cohort:
              taskOutputArtifact:
                outputArtifactKey: cohort
                producerTask: notebook-load
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: cluster-split
      distributed-train:
        cachingOptions: {}
        componentRef:
          name: comp-distributed-train
        dependentTasks:
        - cluster-split
        inputs:
          artifacts:
            partitions:
              taskOutputArtifact:
                outputArtifactKey: partitions
                producerTask: cluster-split
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: distributed-train
      notebook-load:
        cachingOptions: {}
        componentRef:
          name: comp-notebook-load
        inputs:
          parameters:
            workspace:
              componentInputParameter: workspace
        taskInfo:
          name: notebook-load
      validate-saved-model:
        cachingOptions: {}
        componentRef:
          name: comp-validate-saved-model
        dependentTasks:
        - distributed-train
        inputs:
          artifacts:
            selection:
              taskOutputArtifact:
                outputArtifactKey: selection
                producerTask: distributed-train
        taskInfo:
          name: validate-saved-model
  inputDefinitions:
    parameters:
      workspace:
        defaultValue: /ml-data/notebook-distributed
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.3
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-cluster-evaluate:
          imagePullPolicy: Never
          pvcMount:
          - constant: iot-ml-code
            mountPath: /workspace
            pvcNameParameter:
              runtimeValue:
                constant: iot-ml-code
