<rect x="64" y="1062" width="1792" height="1" rx="0" fill="#DCE5ED"/>
<text x="64" y="1094" font-family="Segoe UI,DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526579">The API rechecks both clocks and the model pin before returning a score. The synthetic score is not a calibrated industrial failure probability. Services and live feature data are retained runtime state.</text>
