<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1525 995" font-family="Arial,sans-serif" role="img" aria-label="IoT application execution paths"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#334155"/></marker></defs><rect width="1525" height="995" fill="#fff"/><text x="30" y="53.0" fill="#172554" font-size="35" font-weight="700">IoT Maintenance Platform | Application execution paths</text><text x="30" y="89.0" fill="#172554" font-size="21" font-weight="400">Follow the API or job that starts each workflow, the payload it passes and the result it produces.</text><text x="30" y="140.0" fill="#1e3a5f" font-size="25" font-weight="700">01  Batch data and training</text><rect x="30" y="160" width="253" height="104" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="40" y="187.0" fill="#172554" font-size="19" font-weight="700">Telemetry generator</text><text x="40" y="211.0" fill="#172554" font-size="15" font-weight="400">Partitioned JSONL</text><path d="M285 217h43" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="283.0" fill="#1e3a5f" font-size="15" font-weight="400">raw files</text><rect x="332" y="160" width="253" height="104" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="342" y="187.0" fill="#172554" font-size="19" font-weight="700">Airflow + Spark</text><text x="342" y="211.0" fill="#172554" font-size="15" font-weight="400">iot_dp1_bronze</text><text x="342" y="229.75" fill="#172554" font-size="15" font-weight="400">iot_dp2_warehouse</text><text x="342" y="248.5" fill="#172554" font-size="15" font-weight="400">iot_dp3_features</text><path d="M587 217h43" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/><text x="584" y="283.0" fill="#1e3a5f" font-size="15" font-weight="400">validated outputs</text><rect x="634" y="160" width="253" height="104" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="644" y="187.0" fill="#172554" font-size="19" font-weight="700">Offline feature history</text><text x="644" y="211.0" fill="#172554" font-size="15" font-weight="400">Gold Parquet + registry</text><text x="644" y="229.75" fill="#172554" font-size="15" font-weight="400">Labels exported separately</text><path d="M889 217h43" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/><text x="886" y="283.0" fill="#1e3a5f" font-size="15" font-weight="400">history + labels</text><rect x="936" y="160" width="253" height="104" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="946" y="187.0" fill="#172554" font-size="19" font-weight="700">Kubeflow Pipelines</text><text x="946" y="211.0" fill="#172554" font-size="15" font-weight="400">Feast / DuckDB history</text><text x="946" y="229.75" fill="#172554" font-size="15" font-weight="400">Join labels; train; evaluate</text><path d="M1191 217h43" stroke="#1e3a5f" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="283.0" fill="#1e3a5f" font-size="15" font-weight="400">model artifact</text><rect x="1238" y="160" width="253" height="104" rx="10" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text x="1248" y="187.0" fill="#172554" font-size="19" font-weight="700">MLflow + Jenkins</text><text x="1248" y="211.0" fill="#172554" font-size="15" font-weight="400">Register model version</text><text x="1248" y="229.75" fill="#172554" font-size="15" font-weight="400">Gate KServe release</text><text x="30" y="340.0" fill="#047857" font-size="25" font-weight="700">02  Streaming data</text><rect x="30" y="360" width="253" height="104" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="40" y="387.0" fill="#172554" font-size="19" font-weight="700">Kafka broker</text><text x="40" y="411.0" fill="#172554" font-size="15" font-weight="400">Telemetry events</text><path d="M285 417h43" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="483.0" fill="#047857" font-size="15" font-weight="400">consume</text><rect x="332" y="360" width="253" height="104" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="342" y="387.0" fill="#172554" font-size="19" font-weight="700">Flink job</text><text x="342" y="411.0" fill="#172554" font-size="15" font-weight="400">Key by machine</text><text x="342" y="429.75" fill="#172554" font-size="15" font-weight="400">10 min event-time windows</text><path d="M587 417h43" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/><text x="584" y="483.0" fill="#047857" font-size="15" font-weight="400">window result</text><rect x="634" y="360" width="253" height="104" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="644" y="387.0" fill="#172554" font-size="19" font-weight="700">Finalized-window writer</text><text x="644" y="411.0" fill="#172554" font-size="15" font-weight="400">Persist windows to Parquet</text><text x="644" y="429.75" fill="#172554" font-size="15" font-weight="400">Publish online aggregates</text><path d="M889 417h43" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/><text x="886" y="483.0" fill="#047857" font-size="15" font-weight="400">publish</text><rect x="936" y="360" width="253" height="104" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="946" y="387.0" fill="#172554" font-size="19" font-weight="700">Monitoring features</text><text x="946" y="411.0" fill="#172554" font-size="15" font-weight="400">Separate Feast project</text><text x="946" y="429.75" fill="#172554" font-size="15" font-weight="400">4 stream aggregates</text><path d="M1191 417h43" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="483.0" fill="#047857" font-size="15" font-weight="400">read</text><rect x="1238" y="360" width="253" height="104" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="1248" y="387.0" fill="#172554" font-size="19" font-weight="700">Window-cohort check</text><text x="1248" y="411.0" fill="#172554" font-size="15" font-weight="400">Check the published vector</text><text x="1248" y="429.75" fill="#172554" font-size="15" font-weight="400">Separate from prediction inputs</text><text x="30" y="540.0" fill="#c2410c" font-size="25" font-weight="700">03  Prediction API</text><rect x="30" y="560" width="253" height="104" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="40" y="587.0" fill="#172554" font-size="19" font-weight="700">Client</text><text x="40" y="611.0" fill="#172554" font-size="15" font-weight="400">Machine ID: P-001</text><path d="M285 617h43" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="683.0" fill="#c2410c" font-size="15" font-weight="400">HTTPS</text><rect x="332" y="560" width="253" height="104" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="342" y="587.0" fill="#172554" font-size="19" font-weight="700">NGINX gateway</text><text x="342" y="611.0" fill="#172554" font-size="15" font-weight="400">TLS, auth, rate limit</text><path d="M587 617h43" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="584" y="683.0" fill="#c2410c" font-size="15" font-weight="400">forward</text><rect x="634" y="560" width="253" height="104" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="644" y="587.0" fill="#172554" font-size="19" font-weight="700">Feature API</text><text x="644" y="611.0" fill="#172554" font-size="15" font-weight="400">POST /v1/machines/</text><text x="644" y="629.75" fill="#172554" font-size="15" font-weight="400">{machine_id}:predict</text><path d="M889 617h43" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="886" y="683.0" fill="#c2410c" font-size="15" font-weight="400">lookup</text><rect x="936" y="560" width="253" height="104" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="946" y="587.0" fill="#172554" font-size="19" font-weight="700">Online lookup + validation</text><text x="946" y="611.0" fill="#172554" font-size="15" font-weight="400">Feast SDK reads Redis</text><text x="946" y="629.75" fill="#172554" font-size="15" font-weight="400">8 serving inputs; freshness gate</text><path d="M1191 617h43" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="683.0" fill="#c2410c" font-size="15" font-weight="400">eligible vector</text><rect x="1238" y="560" width="253" height="104" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="1248" y="587.0" fill="#172554" font-size="19" font-weight="700">KServe predictor</text><text x="1248" y="611.0" fill="#172554" font-size="15" font-weight="400">POST /v1/models/{model}:predict</text><text x="1248" y="629.75" fill="#172554" font-size="15" font-weight="400">Return score via Feature API</text><text x="30" y="740.0" fill="#6d28d9" font-size="25" font-weight="700">04  Agent request</text><rect x="30" y="760" width="253" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="40" y="787.0" fill="#172554" font-size="19" font-weight="700">A2A client</text><text x="40" y="811.0" fill="#172554" font-size="15" font-weight="400">message/send</text><path d="M285 817h43" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="883.0" fill="#6d28d9" font-size="15" font-weight="400">JSON-RPC</text><rect x="332" y="760" width="253" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="342" y="787.0" fill="#172554" font-size="19" font-weight="700">kagent controller</text><text x="342" y="811.0" fill="#172554" font-size="15" font-weight="400">/api/a2a-sandboxes/</text><text x="342" y="829.75" fill="#172554" font-size="15" font-weight="400">iot-agents/iot-coordinator</text><path d="M587 817h43" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/><text x="584" y="883.0" fill="#6d28d9" font-size="15" font-weight="400">dispatch</text><rect x="634" y="760" width="253" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="644" y="787.0" fill="#172554" font-size="19" font-weight="700">Coordinator</text><text x="644" y="811.0" fill="#172554" font-size="15" font-weight="400">Delegate through controller</text><text x="644" y="829.75" fill="#172554" font-size="15" font-weight="400">Combine child results</text><path d="M889 817h43" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/><text x="886" y="883.0" fill="#6d28d9" font-size="15" font-weight="400">delegate</text><rect x="936" y="760" width="253" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="946" y="787.0" fill="#172554" font-size="19" font-weight="700">Retrieval + drift agents</text><text x="946" y="811.0" fill="#172554" font-size="15" font-weight="400">MCP calls to private tool APIs</text><text x="946" y="829.75" fill="#172554" font-size="15" font-weight="400">Features, RAG and drift</text><path d="M1191 817h43" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/><text x="1188" y="883.0" fill="#6d28d9" font-size="15" font-weight="400">generate*</text><rect x="1238" y="760" width="253" height="104" rx="10" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text x="1248" y="787.0" fill="#172554" font-size="19" font-weight="700">Shared inference</text><text x="1248" y="811.0" fill="#172554" font-size="15" font-weight="400">All 3 roles → llm-d</text><text x="1248" y="829.75" fill="#172554" font-size="15" font-weight="400">→ observer → GPU llama.cpp</text><text x="30" y="937.0" fill="#172554" font-size="18" font-weight="400">* Model calls originate in all three agents. Agentgateway passed temporary routing checks; llm-d remains the default.</text><text x="30" y="970.0" fill="#172554" font-size="18" font-weight="400">Operations: DataHub records lineage and validation; Vault supplies credentials; Prometheus and Jaeger observe runtime.</text></svg>
