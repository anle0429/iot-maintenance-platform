<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Platform Architecture · Interactive flows</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; color: #263641; background: #f2f5f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1540px; margin: auto; padding: clamp(8px, 2vw, 28px); }
    .viewer { overflow: hidden; border: 1px solid #ced8de; border-radius: 13px; background: white; }
    .viewport { overflow: auto; }
    .viewport svg { display: block; width: 100%; height: auto; }
    .viewport.zoomed { max-height: 72vh; }
    .viewport.zoomed svg { width: 2800px; max-width: none; }
    [data-static-legend] { display: none; }
    [data-element][data-flows] { transition: opacity 180ms ease; }
    [data-element].muted { opacity: .17; }
    [data-dot].muted { display: none; }
    footer { padding: 12px clamp(10px, 2vw, 22px) 15px; border-top: 1px solid #dce4e8; }
    nav, .view-options { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .view-options { margin-top: 10px; }
    button { font: inherit; color: inherit; cursor: pointer; background: white; border: 1px solid #b9c9d2; }
    button:focus-visible { outline: 2px solid #1769ab; outline-offset: 3px; }
    .filter { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; min-height: 36px; border-radius: 30px; color: var(--ink); border-color: color-mix(in srgb, var(--ink), white 56%); }
    .filter::before { content: ""; width: 14px; border-top: 2px solid currentColor; }
    .filter.dashed::before { border-top-style: dashed; }
    .filter[data-flow="all"]::before { content: none; }
    .filter:hover, .filter[aria-pressed="true"] { background: color-mix(in srgb, var(--ink), white 88%); }
    .filter[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .view-options button { min-height: 32px; padding: 2px 8px; border-radius: 5px; }
    .view-options button:hover { background: #eef4f7; }
    .sr-only { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) {
      [data-element][data-flows] { transition: none; }
      #motion { display: none; }
    }
  </style>
</head>

      <footer>
        <nav aria-label="Filter architecture flows">
          <button type="button" class="filter" style="--ink:#263641" data-flow="all" aria-pressed="true">All flows</button>
<button type="button" class="filter" style="--ink:#1769ab" data-flow="B" aria-pressed="false">Batch</button>
<button type="button" class="filter" style="--ink:#ba570a" data-flow="S" aria-pressed="false">Streaming</button>
<button type="button" class="filter" style="--ink:#127055" data-flow="F" aria-pressed="false">Feature publication / build</button>
<button type="button" class="filter" style="--ink:#077e72" data-flow="Q" aria-pressed="false">SQL inspection</button>
<button type="button" class="filter dashed" style="--ink:#8a299c" data-flow="O" aria-pressed="false">Orchestration</button>
<button type="button" class="filter dashed" style="--ink:#6641ba" data-flow="G" aria-pressed="false">Governance</button>
<button type="button" class="filter dashed" style="--ink:#846358" data-flow="I" aria-pressed="false">Infrastructure</button>
        </nav>
        <div class="view-options">
          <button id="motion" type="button">Pause motion</button>
          <button id="zoom" type="button" aria-controls="diagram">Read labels</button>
        </div>
        <span class="sr-only" role="status" id="selection-status"></span>
      </footer>
    </section>
  </main>
  <script>
    const viewport = document.getElementById("diagram");
    const svg = viewport.querySelector("svg");
    const filters = [...document.querySelectorAll("button[data-flow]")];
    const layers = [...svg.querySelectorAll("[data-flows]")].map(element => ({
      element,
      flows: element.dataset.flows.split(" "),
    }));
    const status = document.getElementById("selection-status");
    const motion = document.getElementById("motion");
    const zoom = document.getElementById("zoom");

    function selectFlow(button) {
      const selected = button.dataset.flow;
      for (const filter of filters) filter.setAttribute("aria-pressed", String(filter === button));
      for (const { element, flows } of layers) {
        element.classList.toggle("muted", selected !== "all" && !flows.includes(selected));
      }
      status.textContent = selected === "all" ? "Showing all flows." : "Highlighted flow: " + button.textContent + ".";
    }
    for (const button of filters) button.addEventListener("click", () => selectFlow(button));

    motion.addEventListener("click", () => {
      if (svg.animationsPaused()) {
        svg.unpauseAnimations();
        motion.textContent = "Pause motion";
      } else {
        svg.pauseAnimations();
        motion.textContent = "Resume motion";
      }
    });
    zoom.addEventListener("click", () => {
      const zoomed = viewport.classList.toggle("zoomed");
      zoom.textContent = zoomed ? "Fit diagram" : "Read labels";
    });
  </script>
