{{- range $role := list "retrieval" "drift" }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: iot-{{ $role }}-tools
spec:
  description: Authenticated {{ $role }} tools for the simulated IoT pump platform.
  url: http://iot-{{ $role }}-mcp.iot-agents.svc.cluster.local:8080/mcp
  protocol: STREAMABLE_HTTP
  timeout: 30s
  terminateOnClose: true
  allowedNamespaces: {from: Same}
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: iot-agent-tool-headers, key: {{ $role }}}
{{- if $.Values.agentgateway.enabled }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: iot-gateway-{{ $role }}-tools
spec:
  description: Authenticated {{ $role }} tools through the selected private Agentgateway.
  url: http://iot-agentgateway-candidate.iot-agents.svc.cluster.local:18083/mcp/{{ $role }}
  protocol: STREAMABLE_HTTP
  timeout: 30s
  terminateOnClose: true
  allowedNamespaces: {from: Same}
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: iot-agent-tool-headers, key: {{ $role }}}
{{- end }}
{{- end }}
