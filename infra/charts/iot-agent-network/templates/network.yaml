# Substrate 0.0.9 masquerades actor traffic behind its dedicated worker Pod IP.
# Kubernetes policies are additive: restrict worker EGRESS instead of adding another MCP ingress allow rule.
{{- range $role := list "retrieval" "drift" "coordinator" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iot-{{ $role }}-worker-egress
  labels: {iot.coursework/agent-network: 'true'}
  annotations: {iot.coursework/policy-version: '0.1.0'}
spec:
  podSelector:
    matchLabels: {ate.dev/worker-pool: iot-{{ $role }}-pool}
  policyTypes: [Egress]
  egress:
    # The trusted worker needs Substrate's private API, DNS, Valkey and snapshot storage.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock:
            cidr: {{ required "Supply the observed private control-node /32" $.Values.controlCIDR | quote }}
      ports: [{protocol: TCP, port: 6443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: iot-llm}
          podSelector:
            matchLabels: {llm-d-router-gateway: iot-router-epp}
      ports: [{protocol: TCP, port: 8081}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: iot-agents}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
      ports: [{protocol: TCP, port: 8083}]
    {{- if ne $role "coordinator" }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: iot-agents}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: iot-{{ $role }}-mcp}
      ports: [{protocol: TCP, port: 8080}]
    {{- end }}
{{- end }}
