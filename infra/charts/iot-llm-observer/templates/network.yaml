# Only the existing private router can reach observation/OTLP; no public service, host port or new cloud firewall.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {llm-d-router-gateway: iot-router-epp}
      ports: [{protocol: TCP, port: 8081}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: iot-model-gpu
              app.kubernetes.io/name: iot-llm-model-gpu
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: iot-observability}
          podSelector:
            matchLabels: {app: iot-jaeger}
      ports: [{protocol: TCP, port: 4318}]
