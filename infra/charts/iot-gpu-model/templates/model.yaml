# One physical GPU requires a documented Recreate update; routing is promoted only after candidate acceptance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: iot-llm-model-gpu
    spec:
      automountServiceAccountToken: false
      runtimeClassName: iot-gpu-nvidia
      nodeSelector:
        kubernetes.io/hostname: iot-cw-gpu
        iot.coursework/role: inference-gpu
      tolerations:
        - key: iot.coursework/inference-gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --model
            - /models/{{ .Values.modelFile }}
            - --alias
            - {{ .Values.servedModel | quote }}
            - --host
            - 0.0.0.0
            - --port
            - '8080'
            - --ctx-size
            - {{ .Values.contextTokens | quote }}
            - --threads
            - {{ .Values.threads | quote }}
            - --threads-batch
            - {{ .Values.threads | quote }}
            - --parallel
            - '1'
            - --n-gpu-layers
            - {{ .Values.gpuLayers | quote }}
            - --jinja
            - --metrics
            - --no-webui
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: models
          hostPath: {path: {{ .Values.modelDirectory | quote }}, type: Directory}
        - name: temporary
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: 8080, targetPort: http}]
