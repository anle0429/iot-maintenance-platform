{{- if and .Values.autoscaling.enabled (eq .Values.autoscaling.mode "requests") }}
{{- $search := eq .Values.role "retrieval" }}
{{- $target := ternary (printf "%s-search" .Release.Name) .Release.Name $search }}
{{- $query := printf "sum(rate(iot_mcp_tool_calls_total{job=\"iot-agent-mcp\",namespace=\"%s\",service=\"%s\",role=\"drift\",tool=\"assess_feature_drift\",result=\"success\"}[30s]))" .Release.Namespace $target }}
{{- $threshold := .Values.autoscaling.requestsPerSecondPerReplica }}
{{- if $search }}
{{- $query = printf "sum(rate(iot_rag_search_attempts_total{job=\"iot-rag-search\",namespace=\"%s\",service=\"%s\"}[30s]))" .Release.Namespace $target }}
{{- $threshold = .Values.search.requestsPerSecondPerReplica | default $threshold }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $target }}
  labels:
    iot.coursework/agent-scaling: 'true'
    app.kubernetes.io/part-of: iot-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $target }}
  pollingInterval: 5
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{type: Pods, value: 1, periodSeconds: 30}]
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
          policies: [{type: Pods, value: 1, periodSeconds: 30}]
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: {{ required "Request-rate scaling requires a private Prometheus endpoint" .Values.autoscaling.prometheusAddress | quote }}
        query: {{ $query | quote }}
        threshold: {{ $threshold | quote }}
        ignoreNullValues: 'false'
        timeout: 5s
{{- end }}
