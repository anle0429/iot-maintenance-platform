{{- if .Values.autoscaling.enabled }}
{{- if not (has .Values.autoscaling.mode (list "cpu" "requests")) }}
{{- fail "Choose autoscaling.mode cpu or requests" }}
{{- end }}
{{- if or (lt (int .Values.autoscaling.minReplicas) 1) (lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas)) (le (float64 .Values.autoscaling.requestsPerSecondPerReplica) 0.0) }}
{{- fail "Autoscaling requires positive replica/demand bounds and maxReplicas >= minReplicas" }}
{{- end }}
{{- if and (eq .Values.role "retrieval") (eq .Values.autoscaling.mode "requests") (hasKey .Values.search "requestsPerSecondPerReplica") (le (float64 .Values.search.requestsPerSecondPerReplica) 0.0) }}
{{- fail "Search request-rate scaling requires a positive demand target" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: iot-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if or (eq .Values.role "retrieval") (not .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: iot-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        iot.coursework/tool-role: {{ .Values.role }}
      annotations:
        iot.coursework/source-sha256: {{ .Values.sourceSha256 | quote }}
        iot.coursework/revision: {{ .Values.revisionMarker | quote }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: Never
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: IOT_MCP_ROLE, value: {{ .Values.role | quote }}}
            - {name: IOT_MCP_TOKEN_FILE, value: /credential/token}
            - {name: IOT_DRIFT_REFERENCE_ID, value: {{ .Values.referenceId | quote }}}
            - {name: IOT_DRIFT_SCOPE, value: {{ .Values.driftScope | quote }}}
            {{- if eq .Values.role "retrieval" }}
            - {name: IOT_RAG_SEARCH_URL, value: "http://{{ .Release.Name }}-search.{{ .Release.Namespace }}.svc.cluster.local"}
            - {name: IOT_RAG_SEARCH_TOKEN_FILE, value: /search-credential/token}
            {{- end }}
            - {name: HF_HUB_OFFLINE, value: '1'}
            - {name: FEAST_USAGE, value: 'False'}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - {name: credential, mountPath: /credential, readOnly: true}
            - {name: temporary, mountPath: /tmp}
            {{- if eq .Values.role "retrieval" }}
            - {name: search-credential, mountPath: /search-credential, readOnly: true}
            {{- end }}
      volumes:
        - name: credential
          secret:
            secretName: {{ required "A role-scoped secret is required" .Values.tokenSecret }}
            defaultMode: 0440
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        {{- if eq .Values.role "retrieval" }}
        - name: search-credential
          secret:
            secretName: {{ .Release.Name }}-search-auth
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: iot-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
