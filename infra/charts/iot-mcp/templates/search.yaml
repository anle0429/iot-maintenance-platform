{{- if eq .Values.role "retrieval" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-search
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.search.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/instance: "{{ .Release.Name }}-search"}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iot-rag-search
        app.kubernetes.io/instance: {{ .Release.Name }}-search
      annotations:
        iot.coursework/source-sha256: {{ .Values.sourceSha256 | quote }}
        iot.coursework/revision: {{ .Values.revisionMarker | quote }}
        iot.coursework/index-seal: {{ .Values.snapshot.sealConfigMap | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: copy-verified-snapshot
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: Never
          command: [python, -m, services.mcp_tools.snapshot]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: snapshot, mountPath: /snapshot, readOnly: true}
            - {name: snapshot-seal, mountPath: /snapshot-seal, readOnly: true}
            - {name: state, mountPath: /state}
      containers:
        - name: search
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: Never
          command: [python, -m, uvicorn, "services.rag_search.app:create_app", --factory, --host, "0.0.0.0", --port, "8080", --no-access-log]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: IOT_RAG_SEARCH_TOKEN_FILE, value: /search-credential/token}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: FEAST_USAGE, value: "False"}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.search.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: search-credential, mountPath: /search-credential, readOnly: true}
            - {name: temporary, mountPath: /tmp}
            - {name: state, mountPath: /state}
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        - name: state
          emptyDir: {sizeLimit: 256Mi}
        - name: snapshot
          hostPath: {path: {{ required "A sealed snapshot directory is required" .Values.snapshot.directory | quote }}, type: Directory}
        - name: snapshot-seal
          configMap:
            name: {{ required "A sealed inventory is required" .Values.snapshot.sealConfigMap }}
        - name: models
          hostPath: {path: {{ .Values.snapshot.modelCache | quote }}, type: Directory}
        - name: search-credential
          secret:
            secretName: {{ .Release.Name }}-search-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-search
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: "{{ .Release.Name }}-search"}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-search
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: "{{ .Release.Name }}-search"}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: "{{ .Release.Name }}"}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: iot-monitoring}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
{{- end }}
