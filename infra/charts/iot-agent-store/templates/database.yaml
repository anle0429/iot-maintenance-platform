apiVersion: v1
kind: ServiceAccount
metadata: {name: iot-agent-database}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: iot-agent-database}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.storage }}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: iot-agent-database-init}
data:
  10-applications.sh: |
    #!/bin/sh
    # Initialize separate least-privilege owners only on a genuinely empty PostgreSQL volume.
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=kagent_password="$KAGENT_PASSWORD" --set=registry_password="$REGISTRY_PASSWORD" <<'SQL'
    CREATE ROLE iot_kagent LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'kagent_password';
    CREATE DATABASE iot_kagent OWNER iot_kagent;
    CREATE ROLE iot_registry LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'registry_password';
    CREATE DATABASE iot_registry OWNER iot_registry;
    REVOKE CONNECT ON DATABASE iot_kagent FROM PUBLIC;
    REVOKE CONNECT ON DATABASE iot_registry FROM PUBLIC;
    SQL
---
apiVersion: v1
kind: Service
metadata: {name: iot-agent-database}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: iot-agent-database}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iot-agent-database}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: iot-agent-database}
  template:
    metadata:
      labels: {app.kubernetes.io/name: iot-agent-database}
    spec:
      serviceAccountName: iot-agent-database
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.credentialSecret }}, key: administrator}}
            - name: KAGENT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.credentialSecret }}, key: kagent}}
            - name: REGISTRY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.credentialSecret }}, key: registry}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres]}
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: temp, mountPath: /tmp}
            - {name: initialization, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: iot-agent-database}}
        - {name: run, emptyDir: {}}
        - {name: temp, emptyDir: {}}
        - name: initialization
          configMap: {name: iot-agent-database-init}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: iot-agent-database}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: iot-agent-database}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {iot.coursework/agent-control: 'true'}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
