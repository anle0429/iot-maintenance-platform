# Install checksum-pinned agent assets; isolate the worker from ordinary hostPath workloads.
- name: Create dedicated agent directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - '{{ iot_gpu_root }}/assets'
    - '{{ iot_gpu_root }}/k3s'
    - /etc/rancher/k3s
- name: Download the exact cluster agent binary
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/v1.35.9%2Bk3s1/k3s
    dest: '{{ iot_gpu_root }}/assets/k3s'
    checksum: 'sha256:{{ iot_k3s_binary_sha256 }}'
    mode: '0755'
    timeout: 180
- name: Download the exact official service installer
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.35.9%2Bk3s1/install.sh
    dest: '{{ iot_gpu_root }}/assets/k3s-install.sh'
    checksum: 'sha256:{{ iot_k3s_installer_sha256 }}'
    mode: '0755'
    timeout: 60
- name: Inspect any existing agent binary
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
    checksum_algorithm: sha256
  register: iot_gpu_existing_binary
- name: Refuse a different existing cluster version
  ansible.builtin.assert:
    that:
      - not iot_gpu_existing_binary.stat.exists or iot_gpu_existing_binary.stat.checksum == iot_k3s_binary_sha256
- name: Install the verified agent binary
  ansible.builtin.copy:
    src: '{{ iot_gpu_root }}/assets/k3s'
    dest: /usr/local/bin/k3s
    remote_src: true
    mode: '0755'
    owner: root
    group: root
  notify: Restart GPU K3s agent
- name: Configure private joining, explicit NVIDIA runtime and reserved scheduling
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    owner: root
    group: root
    force: false
    content: |
      server: https://{{ iot_control_ip }}:6443
      token-file: {{ iot_gpu_root }}/private/agent-token
      data-dir: {{ iot_gpu_root }}/k3s
      node-name: {{ iot_gpu_node_name }}
      node-ip: {{ ansible_facts.default_ipv4.address }}
      flannel-iface: {{ ansible_facts.default_ipv4.interface }}
      default-runtime: nvidia
      node-label:
        - iot.coursework/role=inference-gpu
      node-taint:
        - iot.coursework/inference-gpu=true:NoSchedule
      kubelet-arg:
        - max-pods=24
        - eviction-hard=memory.available<1Gi,nodefs.available<10%,imagefs.available<15%
  notify: Restart GPU K3s agent
- name: Read back the existing agent configuration without credential contents
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/config.yaml
  register: iot_gpu_config
  no_log: true
- name: Refuse a conflicting pre-existing agent configuration
  ansible.builtin.assert:
    that:
      - (iot_gpu_config.content | b64decode | from_yaml).server == 'https://' + iot_control_ip + ':6443'
      - (iot_gpu_config.content | b64decode | from_yaml)['node-name'] == iot_gpu_node_name
      - (iot_gpu_config.content | b64decode | from_yaml)['node-taint'] == ['iot.coursework/inference-gpu=true:NoSchedule']
      - (iot_gpu_config.content | b64decode | from_yaml)['default-runtime'] == 'nvidia'
      - (iot_gpu_config.content | b64decode | from_yaml)['token-file'] == iot_gpu_root + '/private/agent-token'
      - (iot_gpu_config.content | b64decode | from_yaml)['data-dir'] == iot_gpu_root + '/k3s'
  no_log: true
- name: Install the official agent systemd integration without starting early
  ansible.builtin.command:
    argv: [sh, '{{ iot_gpu_root }}/assets/k3s-install.sh', agent]
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: 'true'
    INSTALL_K3S_SKIP_START: 'true'
    INSTALL_K3S_SKIP_ENABLE: 'true'
    INSTALL_K3S_EXEC: agent
- name: Start the dedicated worker
  ansible.builtin.systemd_service:
    name: k3s-agent
    enabled: true
    state: started
  notify: Restart GPU K3s agent
- name: Apply agent configuration before verification
  ansible.builtin.meta: flush_handlers
- name: Read the installed binary version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  changed_when: false
- name: Require the local kubelet port to become reachable
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 10250
    timeout: 240
