# Keep K3s storage on the existing SSD and its API private; do not change cloud firewall or VM scheduling.
- name: Check the pinned official binary and installer bytes
  ansible.builtin.stat:
    path: "{{ iot_cluster_assets }}/{{ item }}"
    checksum_algorithm: sha256
  loop: [k3s, k3s-install.sh]
  register: iot_k3s_assets
- name: Refuse missing or altered vendor assets
  ansible.builtin.assert:
    that:
      - iot_k3s_assets.results[0].stat.checksum == iot_k3s_binary_sha256
      - iot_k3s_assets.results[1].stat.checksum == iot_k3s_installer_sha256
- name: Inspect an existing K3s binary without changing it
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: iot_existing_k3s
- name: Read the installed K3s version when present
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  when: iot_existing_k3s.stat.exists
  register: iot_existing_k3s_version
  changed_when: false
- name: Refuse an unrelated preexisting cluster version
  ansible.builtin.assert:
    that:
      - iot_k3s_release in iot_existing_k3s_version.stdout
  when: iot_existing_k3s.stat.exists
- name: Create private configuration and SSD state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/rancher/k3s, mode: '0700'}
    - {path: /srv/iot-fast/k3s, mode: '0700'}
    - {path: /srv/iot-fast/k3s-storage, mode: '0700'}
- name: Install only the checksum-verified binary
  ansible.builtin.copy:
    src: "{{ iot_cluster_assets }}/k3s"
    dest: /usr/local/bin/k3s
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: Restart coursework K3s
- name: Configure a single private node with encrypted secrets and explicit storage
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
    content: |
      data-dir: /srv/iot-fast/k3s
      default-local-storage-path: /srv/iot-fast/k3s-storage
      write-kubeconfig-mode: "0600"
      node-name: iot-cw-vm
      node-ip: {{ ansible_facts.default_ipv4.address }}
      # Keep K3s's embedded agent reachable on loopback; the VPC firewall admits only IAP SSH22.
      bind-address: 0.0.0.0
      advertise-address: {{ ansible_facts.default_ipv4.address }}
      tls-san:
        - localhost
        - 127.0.0.1
        - {{ ansible_facts.default_ipv4.address }}
      cluster-cidr: 10.52.0.0/16
      service-cidr: 10.53.0.0/16
      cluster-dns: 10.53.0.10
      flannel-iface: {{ ansible_facts.default_ipv4.interface }}
      secrets-encryption: true
      disable-cloud-controller: true
      disable:
        - traefik
        - servicelb
      kubelet-arg:
        - "max-pods=60"
        - "eviction-hard=memory.available<2Gi,nodefs.available<10%,imagefs.available<15%"
  notify: Restart coursework K3s
- name: Install the official systemd integration without starting early
  ansible.builtin.command:
    argv: [sh, "{{ iot_cluster_assets }}/k3s-install.sh"]
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_SKIP_DOWNLOAD: 'true'
    INSTALL_K3S_SKIP_START: 'true'
    INSTALL_K3S_SKIP_ENABLE: 'true'
    INSTALL_K3S_EXEC: server
  notify: Restart coursework K3s
- name: Require SSD before service startup
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: '0755'
- name: Bound control-plane service and keep mount dependency
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/iot-storage.conf
    mode: '0644'
    content: |
      [Unit]
      RequiresMountsFor=/srv/iot-fast
      [Service]
      MemoryMax=8G
      CPUQuota=200%
  notify: Restart coursework K3s
- name: Apply only pending K3s configuration changes
  ansible.builtin.meta: flush_handlers
- name: Enable private K3s on the existing VM
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
- name: Wait for the actual node to become ready
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, node/iot-cw-vm, --timeout=300s]
  changed_when: false
