# Restart only services on the metadata-validated coursework VM when their configuration changes.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
