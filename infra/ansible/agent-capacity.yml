# Raise the retained node's scheduling ceiling for MCP/agent replicas while preserving its resource eviction policy.
- name: Configure pod capacity on the existing coursework node
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    iot_agent_max_pods: 110
    iot_agent_capacity_file: /etc/rancher/k3s/config.yaml.d/20-agent-capacity.yaml
  tasks:
    - name: Read the existing node identity and pod address range
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, get, node, iot-cw-vm, -o, json]
      register: iot_agent_node
      changed_when: false
    - name: Require the retained node and sufficient addresses for the requested ceiling
      ansible.builtin.assert:
        that:
          - (iot_agent_node.stdout | from_json).metadata.name == 'iot-cw-vm'
          - (iot_agent_node.stdout | from_json).spec.podCIDR == '10.52.0.0/24'
          - (iot_agent_node.stdout | from_json).status.nodeInfo.kubeletVersion == 'v1.35.9+k3s1'
          - iot_agent_max_pods | int == 110
    - name: Read base configuration without disclosing cluster credentials
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: iot_agent_base_config
      no_log: true
    - name: Preserve all existing kubelet arguments except the explicit pod ceiling
      ansible.builtin.set_fact:
        iot_agent_kubelet_args: "{{ ((iot_agent_base_config.content | b64decode | from_yaml)['kubelet-arg'] | reject('match', '^max-pods=') | list) + ['max-pods=' ~ (iot_agent_max_pods | string)] }}"
      no_log: true
    - name: Require the existing memory and disk eviction safeguards
      ansible.builtin.assert:
        that:
          - "'eviction-hard=memory.available<2Gi,nodefs.available<10%,imagefs.available<15%' in iot_agent_kubelet_args"
    - name: Inspect configuration drop-ins before adding the owned overlay
      ansible.builtin.find:
        paths: /etc/rancher/k3s/config.yaml.d
        patterns: '*.yaml'
        file_type: file
      register: iot_agent_dropins
    - name: Refuse to override a separate operator's drop-in
      ansible.builtin.assert:
        that:
          - (iot_agent_dropins.files | map(attribute='path') | difference([iot_agent_capacity_file]) | length) == 0
    - name: Create the private configuration overlay directory
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml.d
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Apply only the kubelet argument overlay
      ansible.builtin.copy:
        dest: "{{ iot_agent_capacity_file }}"
        owner: root
        group: root
        mode: '0600'
        content: "{{ {'kubelet-arg': iot_agent_kubelet_args} | to_nice_yaml }}"
      notify: Restart retained K3s configuration
    - name: Apply the configuration before reading back capacity
      ansible.builtin.meta: flush_handlers
    - name: Wait for the same node to become ready
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, node/iot-cw-vm, --timeout=300s]
      changed_when: false
    - name: Read the registered scheduling ceiling
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, get, node, iot-cw-vm, -o, 'jsonpath={.status.allocatable.pods}']
      register: iot_agent_capacity
      changed_when: false
      until: iot_agent_capacity.stdout == (iot_agent_max_pods | string)
      retries: 30
      delay: 2
    - name: Show the verified pod ceiling
      ansible.builtin.debug:
        msg: "The same node now admits up to {{ iot_agent_capacity.stdout }} pods; CPU, RAM and eviction thresholds are unchanged."
  handlers:
    - name: Restart retained K3s configuration
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
