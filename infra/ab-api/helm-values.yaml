# Prepared only. The native CI phase must generate unique immutable config/seed/PVC names for its actual release before deployment.
image: {repository: iot-coursework-ab-api, tag: v1, pullPolicy: Never}
replicas: 1
autoscaling: {enabled: false}
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 2Gi}
env:
  - {name: IOT_FEAST_REDIS, value: online.iot-features.svc.cluster.local:6379}
  - {name: IOT_AB_CONFIG, value: /config/config.json}
  - {name: IOT_SERVING_STATE, value: /state}
  - {name: IOT_DRIFT_REFERENCE, value: /reference/reference.json}
  - {name: IOT_AB_DATABASE, value: /ledger/trials.sqlite}
initContainers:
  - name: copy-state
    image: iot-coursework-ab-api:v1
    imagePullPolicy: Never
    command: [python, -c, "import shutil,pathlib; p=pathlib.Path('/state/registry'); p.mkdir(); [shutil.copyfile('/seed/'+n,'/state/'+n) for n in ['context.json','verification.json','_READY.json']]; shutil.copyfile('/seed/registry.db','/state/registry/registry.db')"]
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
    volumeMounts: [{name: seed, mountPath: /seed, readOnly: true}, {name: state, mountPath: /state}]
volumes:
  - {name: config, configMap: {name: iot-ab-config-v1}}
  - {name: seed, configMap: {name: iot-feature-serving-state-helm}}
  - {name: reference, configMap: {name: iot-drift-reference-v1}}
  - {name: state, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
  - {name: ledger, persistentVolumeClaim: {claimName: iot-ab-ledger-v1}}
  - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
volumeMounts:
  - {name: config, mountPath: /config, readOnly: true}
  - {name: reference, mountPath: /reference, readOnly: true}
  - {name: state, mountPath: /state}
  - {name: ledger, mountPath: /ledger}
  - {name: tmp, mountPath: /tmp}
