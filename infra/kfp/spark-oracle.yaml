# Render __RUN__ with the guarded oracle runner; existing cluster/PVCs only, preserve completed pods.
apiVersion: batch/v1
kind: Job
metadata: {name: __RUN__, namespace: kubeflow}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-runner
      securityContext: {runAsNonRoot: true, runAsUser: 185, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: driver
          image: iot-coursework-spark:3.5.9
          imagePullPolicy: Never
          command: [python3, /workspace/ml/distributed_submit.py]
          args: [--oracle, --workspace, /ml-data/__RUN__, --protocol, /workspace/ml/protocols/medium-60d-v1.json, --output, /ml-data/__RUN__/oracle-verification.json]
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: '2', memory: 10Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONPATH, value: /workspace}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: OMP_NUM_THREADS, value: '1'}
            - name: IOT_DRIVER_POD
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: IOT_DRIVER_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          volumeMounts:
            - {name: code, mountPath: /workspace, readOnly: true}
            - {name: data, mountPath: /ml-data}
            - {name: scratch, mountPath: /ml-scratch}
      volumes:
        - {name: code, persistentVolumeClaim: {claimName: iot-ml-code}}
        - {name: data, persistentVolumeClaim: {claimName: iot-ml-workspace}}
        - {name: scratch, persistentVolumeClaim: {claimName: iot-ml-scratch}}
