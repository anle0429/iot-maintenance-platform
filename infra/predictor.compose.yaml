# Private predictor only: use a host SSH forward to its current Docker IP for manual inspection.
name: iot-predictor
services:
  predictor:
    image: iot-coursework-predictor:v1
    build:
      context: ..
      dockerfile: infra/predictor/Dockerfile
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3).status == 200"]
      interval: 5s
      timeout: 4s
      retries: 12
networks:
  default:
    internal: true
