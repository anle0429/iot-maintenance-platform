# Retained-node JWT installation; snapshot credentials are injected by Secret references in the post-renderer.
auth:
  mode: jwt
  jwt:
    issuer: https://kubernetes.default.svc.cluster.local
    audience: api.ate-system.svc
valkey:
  enabled: true
  replicas: 6
  storageSize: 1Gi
rustfs:
  enabled: true
  storageSize: 16Gi
  bucket: ate-snapshots
  accessKey: injected-from-secret
  secretKey: injected-from-secret
atelet:
  gcpAuthForImagePulls: false
  storageBackend: s3
