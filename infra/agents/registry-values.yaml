# Private persistent catalog; its database URL is supplied by a Secret, never a Helm value.
fullnameOverride: iot-agent-registry
replicaCount: 1
automountServiceAccountToken: false
serviceAccount: {automountServiceAccountToken: false}
rbac: {enabled: false, watchedNamespaces: [iot-agents]}
podLabels: {iot.coursework/agent-control: 'true'}
config:
  enableRegistryValidation: 'true'
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 768Mi}
database:
  postgres:
    type: external
    external:
      secretRef: {name: iot-registry-database, key: url}
