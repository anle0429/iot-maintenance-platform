# Dedicated ephemeral online store for the logical-clock API demo; existing Feast pipeline state is untouched.
apiVersion: v1
kind: Namespace
metadata:
  name: iot-features
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: online, namespace: iot-features}
spec:
  replicas: 1
  selector: {matchLabels: {app: iot-serving-online}}
  template:
    metadata: {labels: {app: iot-serving-online}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.2-alpine@sha256:49aaa47789a458bb5d2786dfc3f95b930eb7e24bd484514307932c5bad5853e5
          command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --save, '', --appendonly, 'no']
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
          livenessProbe:
            exec: {command: [redis-cli, ping]}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: online, namespace: iot-features}
spec:
  selector: {app: iot-serving-online}
  ports: [{port: 6379, targetPort: 6379}]
