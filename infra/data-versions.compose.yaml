# Reuse the existing private MLflow network/server; this file creates only a bounded publisher tool.
name: iot-data-versions
services:
  publisher:
    image: iot-coursework-mlflow:3.17.2
    mem_limit: 4g
    cpus: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace
      MLFLOW_TRACKING_URI: http://tracking:5000
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: 'false'
    volumes:
      - ../ml:/workspace/ml:ro
      - ../scripts:/workspace/scripts:ro
      - ${IOT_DATA_CAS_ROOT:?Set the existing content store path}:/data-cas
      - ${IOT_DATA_VERSION_OUTPUT:?Set a fresh proof directory}:/remote-proof
      - ${IOT_DATA_VERSION_RESTORE:?Set a fresh restore parent directory}:/remote-restores
networks:
  default:
    external: true
    name: iot-mlflow_default
