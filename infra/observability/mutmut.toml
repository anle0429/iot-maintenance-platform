# The new API wrapper is the only changed runtime module; old seven-module serving CI remains a separate historical gate.
[tool.mutmut]
source_paths = ["services/"]
only_mutate = ["services/observed.py"]
pytest_add_cli_args_test_selection = ["tests/api/test_observed.py"]
also_copy = ["ml/", "models/", "tests/fixtures/", "tests/api/", "tests/__init__.py"]
process_isolation = "forkserver"
